name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'releases/**' ]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up Python 3.14
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'
    - name: Ruff check
      uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
      with:
        args: check --preview

  tests:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: test_settings
      PYTHONPATH: .

    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python 3.14
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'

    - name: Install uv
      run: pip install --upgrade uv

    - name: Install dependencies
      run: |
        uv pip install --system -r requirements.txt
        uv pip install --system coverage

    - name: Set up Docker
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Run all tests with coverage
      run: |
        coverage run dev_manage.py test adminconsole.tests

    - name: Generate coverage report
      run: coverage lcov -o coverage.lcov

    - name: Report to QLTY
      uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage.lcov
