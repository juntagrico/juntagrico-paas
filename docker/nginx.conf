worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Security header fallbacks (used when Django doesn't set them)
    map $upstream_http_referrer_policy $django_fallback_referrer_policy {
        ""      "same-origin";
        default "";
    }

    map $upstream_http_cross_origin_opener_policy $django_fallback_coop {
        ""      "same-origin";
        default "";
    }

    map $request_method $post_binary_remote_addr {
        default "";
        POST    $binary_remote_addr;
    }

    limit_req_zone $post_binary_remote_addr zone=password_reset:10m rate=1r/m;
    limit_req_status 429;

    upstream django {
        server app:8000;
    }

    # HTTP server — serves traffic directly on port 80
    server {
        listen 80 default_server;
        server_name localhost;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy $django_fallback_referrer_policy always;
        add_header Cross-Origin-Opener-Policy $django_fallback_coop always;

        # Favicon
        location = /favicon.ico { access_log off; log_not_found off; }

        # Static files — served directly from the shared volume
        location /static/ {
            alias /app/static/;
        }

        # Deny hidden files
        location ~ /\. {
            deny all;
        }

        # No PHP files
        location ~* /.*\.php$ {
            return 404;
        }

        # Block secret/config probes
        location ~* ^/(?:\.env(?:\..*)?|secrets\.json|secrets\.yml|secrets\.yaml|rclone\.conf|service-account\.json|serviceAccountKey\.json|credentials\.json|key\.json)$ {
            return 404;
        }

        # Block WordPress probing
        location ~* ^/(?:wp-json/|wp-json)$ { return 404; }

        # Proxy to Django app
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;
        }
    }

    resolver 127.0.0.11 valid=30s;  # Use Docker's internal DNS
    resolver_timeout 5s;

    # Include per-app nginx configs created by the admin app
    include /etc/nginx/sites/*;
}
