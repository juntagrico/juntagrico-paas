# Postgres listens on the gateway address of the app network (172.30.0.1). The address exists only once Docker has
# created the network, after Postgres started. This lets Postgres listen on it anyway.
# Install: install -o root -g root -m 0644 setup/99-juntagrico-nonlocal-bind.conf /etc/sysctl.d/
net.ipv4.ip_nonlocal_bind = 1
