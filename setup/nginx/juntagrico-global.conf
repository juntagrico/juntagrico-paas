# security headers
add_header Strict-Transport-Security $django_fallback_hsts always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy $django_fallback_referrer_policy always;
add_header Cross-Origin-Opener-Policy $django_fallback_coop always;

# Deny all attempts to access hidden files such as .htaccess, .htpasswd, .DS_Store (Mac).
location ~ /\. {
    deny all;
}

# No php files here
location ~* /.*\.php$ {
    return 404;
}

# Block common secret/config probes
location ~* ^/(?:\.env(?:\..*)?|secrets\.json|secrets\.yml|secrets\.yaml|rclone\.conf|service-account\.json|serviceAccountKey\.json|credentials\.json|key\.json)$ {
    return 404;
}

# Block WordPress probing paths (noise reduction)
location ~* ^/(?:wp-json/|wp-json)$ { return 404; }
