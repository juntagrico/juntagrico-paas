map $upstream_http_strict_transport_security $django_fallback_hsts {
    ""      "max-age=31536000";
    default "";
}

map $upstream_http_referrer_policy $django_fallback_referrer_policy {
    ""      "same-origin";
    default "";
}

map $upstream_http_cross_origin_opener_policy $django_fallback_coop {
    ""      "same-origin";
    default "";
}

map $request_method $post_binary_remote_addr {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $post_binary_remote_addr zone=password_reset:10m rate=1r/m;
limit_req_status 429;
