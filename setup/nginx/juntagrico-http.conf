map $upstream_http_strict_transport_security $django_fallback_hsts {
    ""      "max-age=31536000";
    default "";
}

# needed until leaflet overrides it (Juntagrico 2.0.11)
map $upstream_http_referrer_policy $django_fallback_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}

map $upstream_http_referrer_policy $django_fallback_same_origin_referrer_policy {
    ""      "cross-origin";
    default "";
}


map $upstream_http_cross_origin_opener_policy $django_fallback_coop {
    ""      "same-origin";
    default "";
}

map $request_method $post_binary_remote_addr {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $post_binary_remote_addr zone=password_reset:10m rate=1r/m;
limit_req_status 429;

# Catch-all for unmatched hostnames — prevents nginx from defaulting to the first server_name alphabetically
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

include /var/django/domains/*;
