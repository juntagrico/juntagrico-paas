# Maintenance Mode
if (-f /var/www/MAINTENANCE_MODE) {
    return 503;
}
error_page 503 @maintenance;
location @maintenance {
    root /var/www;
    rewrite ^(.*)$ /maintenance.html break;
}
# end Maintenance Mode

location /static/ {
    root /var/django/projects/$juntagrico_app_name;
}

# location /media/ {
#     root /var/django/projects/$juntagrico_app_name;
# }

location ~* password_reset {
    limit_req zone=password_reset burst=3 nodelay;

    include proxy_params;
    proxy_pass http://$juntagrico_app_host:$juntagrico_app_port;
}

location / {
    include proxy_params;
    proxy_pass http://$juntagrico_app_host:$juntagrico_app_port;
}

include /etc/nginx/snippets/juntagrico-common.conf;
