{% extends "wait_redeploy.html" %}
{% load static %}

{% block next_link %}
    <div id="setup-result" style="display:none;">
        <div id="password-box" class="alert alert-info mt-3">
            <strong>Notiere diese Zugangsdaten:</strong>
            <div class="mt-2">
                <span>Benutzer:</span> <code style="font-size:1.2em; user-select:all;">{{ admin_username }}</code>
            </div>
            <div class="mt-1">
                <span>Passwort:</span> <code style="font-size:1.2em; user-select:all;">{{ admin_password }}</code>
            </div>
        </div>
        <form id="next-form" action="{{ next }}" method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary disabled" id="next">weiter</button>
        </form>
    </div>
{% endblock %}

{% block scripts %}
    <script type="text/javascript">
        var url = '{{ url }}';
        var showResultUrl = '{{ show_result_url }}';
    </script>
    <script type="text/javascript" src="{% static 'js/progress.js' %}"></script>
{% endblock %}
