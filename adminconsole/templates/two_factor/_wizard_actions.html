{% load i18n %}

{% if cancel_url and wizard.steps.current != 'auth' %}
  <a href="{{ cancel_url }}"
     class="float-right btn btn-link">{% trans "Abbrechen" %}</a>
{% endif %}
{% if wizard.steps.prev and wizard.steps.current != 'auth' %}
  <button name="wizard_goto_step" type="submit"
          value="{{ wizard.steps.prev }}"
          class="btn btn-secondary">{% trans "Zurück" %}</button>
{% endif %}
{% if wizard.steps.current == 'auth' %}
  <button type="submit" class="btn btn-primary">{% trans "Anmelden" %}</button>
{% else %}
  <button type="submit" class="btn btn-primary">{% trans "Weiter" %}</button>
{% endif %}
