{% extends "flow/show_result.html" %}

{% block page_subtitle %}
    <h4>Staging-Einrichtung für {{ app.name }}</h4>
{% endblock %}

{% block buttons %}
    {% if overall_failed %}
        <div class="mb-3">
            <form method="post" action="{% url 'staging-create' app.staging_of.id %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-warning">Staging einrichten wiederholen</button>
            </form>
        </div>
    {% endif %}
{% endblock %}
