{% extends "base.html" %}

{% block page_title %}
    <h1>{{ app.name }}</h1>
{% endblock %}

{% block content %}
    <div class="card">
        <h5 class="card-header">Admin-Passwort neu gesetzt</h5>
        <div class="card-body">
            <p class="card-text">
                Neues Passwort für den Benutzer <strong>{{ username }}</strong>.
                Notiere es jetzt: Es wird nicht gespeichert und nur einmal angezeigt.
            </p>
            <p class="h4"><code>{{ password }}</code></p>
        </div>
    </div>

    <div class="mt-3">
        <a href="{% url "overview" app.id %}" class="btn btn-success">zurück zur Übersicht</a>
    </div>
{% endblock %}
