{# Timing controls for a cronjob entry #}
{# Context: cj (cronjob definition), ac (AppCronjob instance or None), form #}
{% load extras %}
{% if cj.timing == 'hourly' %}
    <div class="ml-3 mt-1">
        <label for="minute_{{ cj.id }}">Jede Stunde in Minute:</label>
        <select name="minute_{{ cj.id }}" id="minute_{{ cj.id }}"
                class="custom-select custom-select-sm d-inline-block"
                style="width: auto;">
            {% for val, label in form.minute_choices %}
                <option value="{{ val }}"
                        {% if ac and ac.minute == val %}selected{% endif %}
                        {% if not ac and val == form.default_minute %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>
    </div>
{% elif cj.timing == 'daily' %}
    {% with dm=form|get_default_minute:cj %}
    <div class="ml-3 mt-1">
        <label for="hour_{{ cj.id }}">Stunde:</label>
        <select name="hour_{{ cj.id }}" id="hour_{{ cj.id }}"
                class="custom-select custom-select-sm d-inline-block"
                style="width: auto;">
            {% for val, label in form.hour_choices %}
                <option value="{{ val }}"
                        {% if ac and ac.hour == val %}selected{% endif %}
                        {% if not ac and val == cj.default_hour %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>
        <label for="minute_{{ cj.id }}">Minute:</label>
        <select name="minute_{{ cj.id }}" id="minute_{{ cj.id }}"
                class="custom-select custom-select-sm d-inline-block"
                style="width: auto;">
            {% for val, label in form.minute_choices %}
                <option value="{{ val }}"
                        {% if ac and ac.minute == val %}selected{% endif %}
                        {% if not ac and val == dm %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>
    </div>
    {% endwith %}
{% endif %}
