{# Render app status circle and version badges #}
{# Context: app (App instance) #}
{# The status circle is updated asynchronously via AJAX polling #}
{% load extras %}
<span class="app-status-badge" data-app-name="{{ app.name }}"></span>
<span class="app-version-badges" data-app-name="{{ app.name }}" data-app-version="{{ app.version }}"
    {% if app.juntagrico_version %}data-juntagrico-version="{{ app.juntagrico_version }}"{% endif %}
    {% if app.python_version %}data-python-version="{{ app.python_version }}"{% endif %}>
</span>
